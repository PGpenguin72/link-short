name = "link-short"
compatibility_date = "2026-07-15"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
APP_BASE_URL = "https://link.pg72.tw"
PG72_ID_ISSUER = "https://sso.pg72.tw"
PG72_ID_CLIENT_ID = "pg72-link"

[[d1_databases]]
binding = "DB"
database_name = "link-short-db"
# Replace with your actual database ID after running: npm run db:create
database_id = "96056517-46ea-4fdf-a38b-6544b265d682"

# DEPLOY BLOCKER: Preview needs its own owner-provisioned D1. After provisioning,
# add the real [[env.preview.d1_databases]] binding here; environment-scoped
# configuration must not point at the production database or rely only on a
# dashboard binding.
[env.preview.vars]
APP_BASE_URL = "https://link-preview.pg72.tw"
PG72_ID_ISSUER = "https://sso-preview.pg72.tw"
PG72_ID_CLIENT_ID = "pg72-link-preview"
